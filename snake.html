<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
  }

  .container {
    text-align: center;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 12px;
    color: #00d2ff;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 400px;
    margin: 0 auto 12px;
    font-size: 1rem;
  }

  .info-bar span {
    background: #16213e;
    padding: 6px 16px;
    border-radius: 6px;
    min-width: 100px;
  }

  canvas {
    border: 2px solid #0f3460;
    border-radius: 8px;
    background: #0a0a1a;
    display: block;
    margin: 0 auto;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.15);
  }

  .controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    background: #0f3460;
    color: #e0e0e0;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #1a5276; }
  button:active { background: #0b2540; }

  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .modal {
    background: #16213e;
    padding: 40px 50px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
  }

  .modal h2 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    color: #00d2ff;
  }

  .modal p {
    margin-bottom: 20px;
    font-size: 1.05rem;
    color: #b0b0b0;
  }

  .modal button {
    font-size: 1.1rem;
    padding: 12px 36px;
    background: #00d2ff;
    color: #1a1a2e;
    font-weight: bold;
  }

  .modal button:hover { background: #33ddff; }

  /* Mobile D-pad */
  .dpad {
    display: none;
    margin: 20px auto 0;
    width: 160px;
    height: 160px;
    position: relative;
  }

  .dpad button {
    position: absolute;
    width: 52px;
    height: 52px;
    padding: 0;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: #0f3460;
    user-select: none;
    -webkit-user-select: none;
  }

  .dpad .up    { top: 0;   left: 54px; }
  .dpad .down  { bottom: 0; left: 54px; }
  .dpad .left  { top: 54px; left: 0; }
  .dpad .right { top: 54px; right: 0; }

  @media (pointer: coarse) {
    .dpad { display: block; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>贪吃蛇</h1>

  <div class="info-bar">
    <span>得分: <strong id="score">0</strong></span>
    <span>最高: <strong id="best">0</strong></span>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <button id="btnPause">暂停 (Space)</button>
    <button id="btnRestart">重新开始 (R)</button>
  </div>

  <div class="dpad" id="dpad">
    <button class="up"    data-dir="up">&#9650;</button>
    <button class="down"  data-dir="down">&#9660;</button>
    <button class="left"  data-dir="left">&#9664;</button>
    <button class="right" data-dir="right">&#9654;</button>
  </div>
</div>

<!-- Start overlay -->
<div class="overlay" id="startOverlay">
  <div class="modal">
    <h2>贪吃蛇</h2>
    <p>方向键 / WASD 控制方向<br>空格暂停，R 重新开始</p>
    <button id="btnStart">开始游戏</button>
  </div>
</div>

<!-- Game-over overlay -->
<div class="overlay hidden" id="overOverlay">
  <div class="modal">
    <h2>游戏结束</h2>
    <p>得分: <strong id="finalScore">0</strong></p>
    <button id="btnRetry">再来一次</button>
  </div>
</div>

<script>
(() => {
  // ---- Constants ----
  const COLS = 20;
  const ROWS = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / COLS;

  // ---- State ----
  let snake, dir, nextDir, food, score, best, speed, timer, running, paused;

  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  document.getElementById('best').textContent = best;

  // ---- Init ----
  function init() {
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 },
    ];
    dir = 'right';
    nextDir = 'right';
    score = 0;
    speed = 150;
    paused = false;
    document.getElementById('score').textContent = score;
    document.getElementById('btnPause').textContent = '暂停 (Space)';
    placeFood();
  }

  // ---- Food ----
  function placeFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (occupied.has(`${pos.x},${pos.y}`));
    food = pos;
  }

  // ---- Drawing ----
  function draw() {
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
    }

    // Snake
    snake.forEach((seg, i) => {
      const t = 1 - i / snake.length;
      const g = Math.round(180 + 75 * t);
      ctx.fillStyle = i === 0 ? '#00d2ff' : `rgb(0, ${g}, 100)`;
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
    });

    // Eyes on head
    const head = snake[0];
    ctx.fillStyle = '#1a1a2e';
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const eyeOff = { up: [{x:-3,y:-4},{x:3,y:-4}], down: [{x:-3,y:4},{x:3,y:4}],
                      left: [{x:-4,y:-3},{x:-4,y:3}], right: [{x:4,y:-3},{x:4,y:3}] };
    (eyeOff[dir] || eyeOff['right']).forEach(o => {
      ctx.beginPath(); ctx.arc(cx + o.x, cy + o.y, 2, 0, Math.PI * 2); ctx.fill();
    });

    // Food
    ctx.fillStyle = '#ff6b6b';
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ---- Game loop ----
  function step() {
    if (!running || paused) return;

    dir = nextDir;

    const head = { ...snake[0] };
    if (dir === 'up')    head.y--;
    if (dir === 'down')  head.y++;
    if (dir === 'left')  head.x--;
    if (dir === 'right') head.x++;

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
      score++;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', best);
        document.getElementById('best').textContent = best;
      }
      placeFood();
      // Speed up slightly
      speed = Math.max(60, speed - 2);
    } else {
      snake.pop();
    }

    draw();
    clearTimeout(timer);
    timer = setTimeout(step, speed);
  }

  function startGame() {
    init();
    running = true;
    draw();
    timer = setTimeout(step, speed);
  }

  function gameOver() {
    running = false;
    clearTimeout(timer);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('overOverlay').classList.remove('hidden');
  }

  // ---- Direction helpers ----
  const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };

  function setDir(d) {
    if (opposite[d] !== dir) {
      nextDir = d;
    }
  }

  // ---- Input ----
  document.addEventListener('keydown', e => {
    const key = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' ','r'].includes(key)) {
      e.preventDefault();
    }
    if (key === 'ArrowUp'    || key === 'w') setDir('up');
    if (key === 'ArrowDown'  || key === 's') setDir('down');
    if (key === 'ArrowLeft'  || key === 'a') setDir('left');
    if (key === 'ArrowRight' || key === 'd') setDir('right');
    if (key === ' ') togglePause();
    if (key === 'r') restartGame();
  });

  function togglePause() {
    if (!running) return;
    paused = !paused;
    document.getElementById('btnPause').textContent = paused ? '继续 (Space)' : '暂停 (Space)';
    if (!paused) { timer = setTimeout(step, speed); }
  }

  function restartGame() {
    clearTimeout(timer);
    document.getElementById('overOverlay').classList.add('hidden');
    document.getElementById('startOverlay').classList.add('hidden');
    startGame();
  }

  // ---- Buttons ----
  document.getElementById('btnStart').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    startGame();
  });

  document.getElementById('btnRetry').addEventListener('click', restartGame);
  document.getElementById('btnPause').addEventListener('click', togglePause);
  document.getElementById('btnRestart').addEventListener('click', restartGame);

  // ---- Mobile D-pad ----
  document.querySelectorAll('#dpad button').forEach(btn => {
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      setDir(btn.dataset.dir);
    });
    btn.addEventListener('click', () => setDir(btn.dataset.dir));
  });

  // ---- Initial draw ----
  init();
  draw();
})();
</script>
</body>
</html>
