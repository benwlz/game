<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Design — PatchCraft</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow: hidden; }

  .create-page {
    display: flex; flex-direction: column;
    height: calc(100vh - var(--nav-h));
  }

  /* ---- Compact steps bar ---- */
  .steps-bar {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: 10px 24px;
  }
  .steps-bar .steps { margin-bottom: 0; }

  /* ---- Main layout ---- */
  .create-body {
    display: flex; flex: 1; min-height: 0;
  }

  /* ---- Sidebar ---- */
  .create-sidebar {
    width: 280px; background: var(--white);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto; flex-shrink: 0;
  }
  .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-section h3 {
    font-size: 0.9rem; font-weight: 600; margin-bottom: 10px;
  }

  .carrier-option {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 10px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background 0.2s;
    border: 2px solid transparent; margin-bottom: 6px;
  }
  .carrier-option:hover { background: var(--blush); }
  .carrier-option.selected { border-color: var(--coral); background: var(--blush); }
  .carrier-option img { width: 52px; height: 36px; object-fit: contain; border-radius: 4px; background: var(--cream); }
  .carrier-option .info { flex: 1; }
  .carrier-option .co-name { font-weight: 600; font-size: 0.8rem; }
  .carrier-option .co-meta { font-size: 0.7rem; color: var(--text-light); }
  .carrier-option .co-price { font-weight: 700; color: var(--coral); font-size: 0.8rem; }

  .patch-filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .patch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .patch-item {
    border: 2px solid var(--border); border-radius: var(--radius-xs);
    padding: 4px; text-align: center; cursor: grab;
    transition: border-color 0.2s, transform 0.15s;
    background: var(--white);
  }
  .patch-item:hover { border-color: var(--coral); transform: scale(1.05); }
  .patch-item img { width: 100%; aspect-ratio: 1; object-fit: contain; pointer-events: none; }
  .patch-item .pi-name { font-size: 0.6rem; font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .patch-item .pi-price { font-size: 0.55rem; color: var(--coral); font-weight: 600; }

  /* ---- Main editor area ---- */
  .create-main {
    flex: 1; display: flex; flex-direction: column;
    background: var(--cream); min-width: 0;
  }

  /* Toolbar */
  .editor-toolbar {
    display: flex; gap: 8px; padding: 8px 16px; align-items: center;
    background: var(--white); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; flex-shrink: 0;
  }
  .toolbar-group {
    display: flex; align-items: center; gap: 6px;
  }
  .toolbar-sep {
    width: 1px; height: 24px; background: var(--border); margin: 0 4px;
  }
  .side-toggle {
    display: flex; border-radius: 50px; overflow: hidden; border: 2px solid var(--border);
  }
  .side-toggle button {
    padding: 5px 14px; border: none; background: var(--white); cursor: pointer;
    font-weight: 500; font-size: 0.8rem; transition: all 0.2s;
  }
  .side-toggle button.active { background: var(--coral); color: var(--white); }

  /* Zoom controls */
  .zoom-controls {
    display: flex; align-items: center; gap: 4px;
  }
  .zoom-controls button {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--white);
    cursor: pointer; font-size: 1rem; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .zoom-controls button:hover { border-color: var(--coral); color: var(--coral); }
  .zoom-pct {
    font-size: 0.75rem; font-weight: 600; min-width: 42px;
    text-align: center; color: var(--text-light);
  }
  .zoom-slider {
    width: 80px; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; outline: none;
  }
  .zoom-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--coral); cursor: pointer;
  }

  /* Canvas viewport (scrollable container) */
  .canvas-viewport {
    flex: 1; overflow: auto; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .canvas-viewport.scrollable {
    align-items: flex-start; justify-content: flex-start;
  }

  .canvas-area {
    position: relative; flex-shrink: 0;
    background: #f5f0eb;
    border-radius: var(--radius);
    box-shadow: 0 4px 24px var(--shadow-md);
    overflow: visible;
  }
  .canvas-area img.carrier-bg {
    display: block; width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none; user-select: none;
    border-radius: var(--radius);
  }

  .patch-zone {
    position: absolute; border: 2px dashed rgba(232,131,93,0.35);
    border-radius: 4px; pointer-events: none;
  }

  .placed-patch {
    position: absolute; cursor: move; user-select: none;
    touch-action: none;
  }
  .placed-patch img {
    display: block; width: 100%; height: 100%;
    pointer-events: none;
  }
  .placed-patch.selected { outline: 2px solid var(--coral); outline-offset: 2px; }

  .rotate-handle {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--coral); cursor: grab;
    display: none; border: 2px solid var(--white);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .rotate-handle::before {
    content: ''; position: absolute; top: 100%; left: 50%; margin-left: -0.5px;
    width: 1px; height: 6px; background: var(--coral);
  }
  .placed-patch.selected .rotate-handle { display: block; }

  .delete-handle {
    position: absolute; top: -8px; right: -8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #E85555; color: white;
    display: none; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; cursor: pointer;
    border: 2px solid var(--white);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .placed-patch.selected .delete-handle { display: flex; }

  .drag-ghost {
    position: fixed; pointer-events: none; z-index: 300;
    opacity: 0.8; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }

  /* ---- Step 3 summary ---- */
  .summary-wrap { max-width: 600px; margin: 0 auto; padding: 24px; }
  .summary-preview { display: flex; gap: 16px; margin-bottom: 20px; justify-content: center; }
  .summary-preview .thumb {
    border-radius: var(--radius-sm); border: 2px solid var(--border);
    overflow: hidden; background: var(--blush);
  }
  .summary-preview .thumb canvas { display: block; }
  .summary-table { width: 100%; }
  .summary-table td { padding: 6px 0; font-size: 0.9rem; }
  .summary-table .label { color: var(--text-light); }
  .summary-table .value { text-align: right; font-weight: 600; }
  .summary-total { font-size: 1.2rem; color: var(--coral); }

  /* Price bar */
  .price-bar {
    background: var(--white); border-top: 1px solid var(--border);
    padding: 10px 20px; display: flex; justify-content: space-between;
    align-items: center; flex-shrink: 0;
  }
  .price-bar .total { font-size: 1.1rem; font-weight: 700; color: var(--coral); }

  @media (max-width: 768px) {
    .create-body { flex-direction: column; }
    .create-sidebar { width: 100%; max-height: 35vh; }
  }
</style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="create-page">
  <!-- Steps bar (compact, no extra margin) -->
  <div class="steps-bar">
    <div class="steps" id="steps-bar">
      <div class="step-item active" data-step="1"><span class="step-num">1</span> Choose Carrier</div>
      <div class="step-line"></div>
      <div class="step-item" data-step="2"><span class="step-num">2</span> Add Patches</div>
      <div class="step-line"></div>
      <div class="step-item" data-step="3"><span class="step-num">3</span> Save &amp; Order</div>
    </div>
  </div>

  <div class="create-body">
    <!-- Sidebar -->
    <aside class="create-sidebar" id="sidebar">
      <div id="sidebar-step1">
        <div class="sidebar-section">
          <h3>Select Carrier</h3>
          <div id="carrier-list"></div>
        </div>
      </div>
      <div id="sidebar-step2" class="hidden">
        <div class="sidebar-section">
          <h3>Category</h3>
          <div class="patch-filters" id="cat-filters"></div>
        </div>
        <div class="sidebar-section">
          <h3>Color</h3>
          <div class="patch-filters" id="color-filters"></div>
        </div>
        <div class="sidebar-section" style="flex:1">
          <h3>Patches</h3>
          <div class="patch-grid" id="patch-list"></div>
        </div>
      </div>
      <div id="sidebar-step3" class="hidden">
        <div class="sidebar-section">
          <h3>Design Summary</h3>
          <div id="summary-content"></div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="create-main" id="main-area">
      <!-- Step 1 -->
      <div id="main-step1" style="flex:1;display:flex;align-items:center;justify-content:center">
        <div class="empty-state">
          <div class="icon">&#128092;</div>
          <p>Select a carrier from the left to get started</p>
        </div>
      </div>

      <!-- Step 2 editor -->
      <div id="main-step2" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div class="editor-toolbar">
          <div class="toolbar-group">
            <div class="side-toggle">
              <button id="btn-front" class="active">Front</button>
              <button id="btn-back">Back</button>
            </div>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-group zoom-controls">
            <button id="btn-zoom-out" title="Zoom out">−</button>
            <input type="range" class="zoom-slider" id="zoom-slider" min="20" max="400" value="100">
            <button id="btn-zoom-in" title="Zoom in">+</button>
            <span class="zoom-pct" id="zoom-pct">100%</span>
            <button id="btn-zoom-fit" title="Fit to view" style="font-size:0.7rem;width:auto;padding:0 8px">Fit</button>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-group">
            <button class="btn btn-outline btn-sm" id="btn-undo" style="padding:5px 12px;font-size:0.8rem">Undo</button>
            <button class="btn btn-outline btn-sm" id="btn-clear-side" style="padding:5px 12px;font-size:0.8rem">Clear</button>
          </div>
        </div>
        <div class="canvas-viewport" id="canvas-viewport">
          <div class="canvas-area" id="canvas-area">
            <img class="carrier-bg" id="carrier-img" src="" alt="carrier">
            <div class="patch-zone" id="patch-zone"></div>
          </div>
        </div>
      </div>

      <!-- Step 3 -->
      <div id="main-step3" class="hidden" style="flex:1;overflow-y:auto">
        <div class="summary-wrap">
          <h2 style="text-align:center;margin-bottom:24px;font-family:var(--font-display);color:var(--dark)">Your Creation</h2>
          <div class="summary-preview" id="preview-images"></div>
          <div id="summary-details"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Price bar (inline, not fixed) -->
  <div class="price-bar" id="price-bar" style="display:none">
    <div>
      <span style="color:var(--text-light);font-size:0.85rem">Total: </span>
      <span class="total" id="price-total">$0.00</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" id="btn-prev" style="padding:6px 16px">Back</button>
      <button class="btn btn-primary btn-sm" id="btn-next" style="padding:6px 16px">Next Step</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/create.js"></script>
</body>
</html>
