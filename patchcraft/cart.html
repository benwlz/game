<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart — PatchCraft</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .cart-page { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .cart-item {
    display: flex; gap: 20px; align-items: center;
    background: var(--white); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .cart-item .thumb {
    width: 120px; height: 90px; border-radius: var(--radius-sm);
    object-fit: contain; background: var(--blush); flex-shrink: 0;
  }
  .cart-item .info { flex: 1; }
  .cart-item .item-name { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
  .cart-item .item-meta { font-size: 0.85rem; color: var(--text-light); }
  .cart-item .item-price { font-weight: 700; color: var(--coral); font-size: 1.1rem; }
  .qty-control {
    display: flex; align-items: center; gap: 8px;
  }
  .qty-control button {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--white);
    cursor: pointer; font-size: 1.1rem; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .qty-control button:hover { border-color: var(--coral); color: var(--coral); }
  .qty-control span { font-weight: 600; min-width: 24px; text-align: center; }
  .cart-footer {
    background: var(--white); border-radius: var(--radius);
    padding: 24px; box-shadow: 0 2px 10px var(--shadow);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-total { font-size: 1.4rem; font-weight: 700; color: var(--coral); }
</style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="cart-page">
  <h1 style="font-family:var(--font-display);color:var(--dark);margin-bottom:32px">Your Cart</h1>

  <div id="cart-items"></div>
  <div id="cart-empty" class="empty-state hidden">
    <div class="icon">&#128722;</div>
    <p>Your cart is empty</p>
    <a href="create.html" class="btn btn-primary mt-16" style="margin-top:16px">Start Creating</a>
  </div>

  <div id="cart-footer" class="cart-footer">
    <div>
      <span style="color:var(--text-light)">Subtotal: </span>
      <span class="cart-total" id="cart-total">$0.00</span>
    </div>
    <div style="display:flex;gap:10px">
      <a href="create.html" class="btn btn-outline btn-sm">Continue Creating</a>
      <button class="btn btn-primary" id="btn-checkout">Checkout</button>
    </div>
  </div>
</div>

<footer class="footer"><p>&copy; 2026 PatchCraft</p></footer>

<script src="js/data.js"></script>
<script>
  renderNav('cart');

  function renderCart() {
    const items = DB.Cart.getAll();
    const container = document.getElementById('cart-items');
    const emptyState = document.getElementById('cart-empty');
    const footer = document.getElementById('cart-footer');

    if (items.length === 0) {
      container.innerHTML = '';
      emptyState.classList.remove('hidden');
      footer.style.display = 'none';
      return;
    }
    emptyState.classList.add('hidden');
    footer.style.display = '';

    container.innerHTML = '';
    items.forEach(item => {
      const design = DB.Designs.getById(item.designId);
      if (!design) return;
      const carrier = DB.Carriers.getById(design.carrierId);
      const allPatches = [...(design.frontPatches || []), ...(design.backPatches || [])];
      const price = DB.getDesignPrice(design);
      const patchNames = allPatches.map(pp => {
        const p = DB.Patches.getById(pp.patchId);
        return p ? p.name : '';
      }).filter(Boolean).join(', ');

      const thumbSrc = design.thumbnail || (carrier ? carrier.frontImage : '');

      const el = document.createElement('div');
      el.className = 'cart-item';
      el.innerHTML = `
        <img class="thumb" src="${thumbSrc}" alt="design">
        <div class="info">
          <div class="item-name">${carrier ? carrier.name : 'Unknown'} — Custom Design</div>
          <div class="item-meta">${allPatches.length} patch${allPatches.length !== 1 ? 'es' : ''}: ${patchNames}</div>
          <div class="item-meta">Front: ${(design.frontPatches||[]).length} · Back: ${(design.backPatches||[]).length}</div>
        </div>
        <div style="text-align:center">
          <div class="qty-control">
            <button class="qty-minus" data-id="${item.id}">−</button>
            <span>${item.quantity || 1}</span>
            <button class="qty-plus" data-id="${item.id}">+</button>
          </div>
          <div class="item-price" style="margin-top:8px">${fmtPrice(price * (item.quantity || 1))}</div>
          <button class="btn btn-sm" style="margin-top:8px;color:#E85555;background:none;padding:4px 8px;font-size:0.8rem" data-remove="${item.id}">Remove</button>
        </div>`;
      container.appendChild(el);
    });

    // Events
    container.querySelectorAll('.qty-minus').forEach(btn =>
      btn.addEventListener('click', () => {
        const item = DB.Cart.getAll().find(i => i.id === btn.dataset.id);
        if (item && (item.quantity || 1) > 1) {
          DB.Cart.update(btn.dataset.id, { quantity: (item.quantity || 1) - 1 });
        }
        renderCart();
      })
    );
    container.querySelectorAll('.qty-plus').forEach(btn =>
      btn.addEventListener('click', () => {
        const item = DB.Cart.getAll().find(i => i.id === btn.dataset.id);
        DB.Cart.update(btn.dataset.id, { quantity: (item.quantity || 1) + 1 });
        renderCart();
      })
    );
    container.querySelectorAll('[data-remove]').forEach(btn =>
      btn.addEventListener('click', () => {
        DB.Cart.remove(btn.dataset.remove);
        renderCart();
        renderNav('cart');
        showToast('Item removed');
      })
    );

    // Total
    document.getElementById('cart-total').textContent = fmtPrice(DB.Cart.getTotal());
  }

  renderCart();

  document.getElementById('btn-checkout').addEventListener('click', () => {
    if (DB.Cart.getAll().length === 0) return showToast('Cart is empty', 'error');
    window.location.href = 'checkout.html';
  });
</script>
</body>
</html>
